name: Update profile card

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - scripts/generate_card.py

permissions:
  contents: write

jobs:
  update-card:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Generate card
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CARD_USERNAME: hammad-waseem
        run: python3 scripts/generate_card.py

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/card.svg
          git diff --staged --quiet || git commit -m "chore: refresh profile card"
          git push
